- name: Nginx | Install Nginx
  dnf:
    name: "@nginx:1.26"
    state: present
  become: true

- name: Nginx | Start and enable service Nginx
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: yes
  become: true

- name: Nginx | Set nginx.conf config
  template:
    src: templates/nginx.conf.j2
    dest: "/etc/nginx/nginx.conf"
  become: true

