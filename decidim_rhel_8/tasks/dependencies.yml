- name: Dependencies | Install Rbenv dependencies
  dnf:
    name: 
      - git
      - wget
      - gcc
      - bzip2
      - openssl-devel
      - libffi-devel
      - readline-devel
      - zlib-devel
      - gdbm-devel
      - ncurses-devel
    state: latest
  become: true

- name: Dependencies | Install Decidim dependencies
  dnf:
    name:
      - libpq-devel
      - libicu-devel
    state: latest
  become: true

- name: Dependencies | Install 'Development tools' package group
  yum:
    name: "@Development Tools"
    state: latest
  become: true

- name: Dependencies | Install EPEL repo
  dnf:
    name: 'https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm'
    state: present
    disable_gpg_check: true
  become: true

- name: Dependencies | Enable EPEL repo
  shell:
    cmd: ARCH=$( /bin/arch ) && subscription-manager repos --enable "codeready-builder-for-rhel-8-${ARCH}-rpms"
  become: true

- name: Dependencies | Install ImageMagick
  dnf:
    name:
      - ImageMagick 
      - ImageMagick-devel
    state: latest
  become: true
