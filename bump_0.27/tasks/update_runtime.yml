- name: Update runtime | Update ruby-build
  shell: 
    cmd: "git -C {{ decidim_deployment_path }}/.rbenv/plugins/ruby-build pull"

- name: Update runtime | Download and install yarn with shell script
  shell:
    cmd: curl -sL https://dl.yarnpkg.com/rpm/yarn.repo | sudo tee /etc/yum.repos.d/yarn.repo
  become: true

- name: Update runtime | Install Yarn
  dnf:
    name: yarn
    state: latest
  become: true
