- name: Decidim | Check if decidim-app directory exists
  stat:
    path: "{{ decidim_app_directory }}"
  register: decidim_app_directory_reg

- name: Decidim | Clean decidim-app directory for modified packages manifest
  shell:
    cmd: "git checkout HEAD package*"
    chdir: "{{ decidim_app_directory }}"
  when: decidim_app_directory_reg.stat.exists and decidim_app_directory_reg.stat.isdir

- name: Decidim | Clone decidim-app repository
  git:
    repo: "{{ decidim_app_repository }}"
    dest: "{{ decidim_app_directory }}"
    version: "{{ repository_branch }}"

- name: Decidim | Get ruby version
  shell:
    cmd: "cat {{ decidim_app_directory }}/.ruby-version"
  register: ruby_version_result

- name: Decidim | Install ruby version
  shell:
    cmd: "{{ decidim_deployment_path }}/.rbenv/bin/rbenv install -s {{ ruby_version_result.stdout }}"
    chdir: "{{ decidim_app_directory }}"

- name: Decidim | Set ruby version
  shell:
    cmd: "{{ decidim_deployment_path }}/.rbenv/bin/rbenv global {{ ruby_version_result.stdout }}"
    chdir: "{{ decidim_app_directory }}"

- name: Decidim | Get bundler version
  shell:
    cmd: "tail -n 1 {{ decidim_app_directory }}/Gemfile.lock | tr -d ' '"
  register: bundler_version_result

- name: Decidim | Install bundler gem
  shell:
    cmd: "{{ decidim_deployment_path }}/.rbenv/shims/gem install bundler:{{ bundler_version_result.stdout }}"
    chdir: "{{ decidim_app_directory }}"

- name: Decidim | Run bundle install
  bundler:
    state: present
    chdir: "{{ decidim_app_directory }}"
    executable: "{{ decidim_deployment_path }}/.rbenv/versions/{{ ruby_version_result.stdout }}/bin/bundle"

# - name: Decidim | Yarn install
#   shell:
#     cmd: "yarn install --frozen-lockfile --non-interactive"
#     chdir: "{{ decidim_app_directory }}"

- name: Decidim | Run migrations
  shell:
    cmd: "RAILS_ENV=production {{ decidim_deployment_path }}/.rbenv/shims/bundle exec rails migrate:db:force"
    chdir: "{{ decidim_app_directory }}"

- name: Decidim | Install webpacker
  shell:
    cmd: "RAILS_ENV=production {{ decidim_deployment_path }}/.rbenv/shims/bundle exec rails decidim:webpacker:install"
    chdir: "{{ decidim_app_directory }}"

- name: Decidim | Precompile assets
  shell:
    cmd: "RAILS_ENV=production {{ decidim_deployment_path }}/.rbenv/shims/bundle exec rails tmp:cache:clear assets:precompile shakapacker:compile"
    chdir: "{{ decidim_app_directory }}"

- name: Decidim | Deface precompile
  shell:
    cmd: "RAILS_ENV=production {{ decidim_deployment_path }}/.rbenv/shims/bundle exec rails deface:precompile"
    chdir: "{{ decidim_app_directory }}"
