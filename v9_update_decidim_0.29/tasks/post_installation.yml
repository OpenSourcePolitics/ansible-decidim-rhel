- name: Decidim post installation tasks for 0.29 | Delay admin password update
  shell:
    cmd: "RAILS_ENV=production {{ decidim_deployment_path }}/.rbenv/shims/bundle exec rails runner \"Decidim::User.where(admin:true).update_all(password_updated_at: Time.now)\""
    chdir: "{{ decidim_app_directory }}"
   
